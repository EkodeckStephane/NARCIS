name: TOMM DiffStega frozen preflight

on:
  workflow_dispatch:
  push:
    branches: [tomm-revision]
    paths:
      - '.github/workflows/tomm-diffstega-preflight.yml'

jobs:
  frozen-preflight:
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    steps:
      - name: Checkout NARCIS frozen revision
        uses: actions/checkout@v4

      - name: Set up Python 3.11.5
        uses: actions/setup-python@v5
        with:
          python-version: '3.11.5'
          cache: pip

      - name: Install frozen DiffStega package versions
        run: |
          python -m pip install --upgrade 'pip<25'
          python -m pip install 'numpy<2' gdown 'huggingface_hub==0.20.3'
          python -m pip install --index-url https://download.pytorch.org/whl/cpu \
            torch==2.1.0 torchvision==0.16.0 torchaudio==2.1.0
          python -m pip install \
            diffusers==0.26.3 accelerate==0.23.0 transformers==4.38.2 controlnet_aux==0.0.7

      - name: Clone exact upstream DiffStega commit
        run: |
          git clone https://github.com/evtricks/DiffStega.git external/DiffStega
          git -C external/DiffStega checkout --detach 73cd7cb8d102f4fc0f5bb168a71cfb948077d89a
          test "$(git -C external/DiffStega rev-parse HEAD)" = '73cd7cb8d102f4fc0f5bb168a71cfb948077d89a'
          mkdir -p evidence
          git -C external/DiffStega rev-parse HEAD | tee evidence/upstream_commit.txt
          git -C external/DiffStega diff --name-only HEAD | tee evidence/upstream_tracked_changes.txt

      - name: Record runner and CUDA state
        run: |
          {
            uname -a
            python --version
            command -v nvidia-smi || true
            nvidia-smi || true
          } | tee evidence/runtime.txt
          python - <<'PY' | tee evidence/torch_runtime.json
          import json, torch
          print(json.dumps({
            'torch': torch.__version__,
            'cuda_available': torch.cuda.is_available(),
            'torch_cuda_runtime': torch.version.cuda,
            'device_count': torch.cuda.device_count(),
            'devices': [torch.cuda.get_device_name(i) for i in range(torch.cuda.device_count())],
          }, indent=2))
          PY

      - name: Resolve frozen model repositories
        run: |
          python - <<'PY' | tee evidence/model_revisions.json
          import json
          from huggingface_hub import model_info
          repos = ['h94/IP-Adapter', 'runwayml/stable-diffusion-v1-5', 'GraydientPlatformAPI/picx-real']
          out = {}
          for repo in repos:
              try:
                  info = model_info(repo)
                  out[repo] = {'sha': info.sha, 'private': info.private, 'gated': getattr(info, 'gated', None)}
              except Exception as e:
                  out[repo] = {'error': f'{type(e).__name__}: {e}'}
          print(json.dumps(out, indent=2))
          PY

      - name: Download required IP-Adapter assets
        run: |
          python - <<'PY'
          from pathlib import Path
          from huggingface_hub import hf_hub_download
          root = Path('external/DiffStega/pretrained_models')
          assets = [
            ('models/ip-adapter-plus_sd15.bin', root/'ip-adapter-plus_sd15.bin'),
            ('models/ip-adapter-plus-face_sd15.bin', root/'ip-adapter-plus-face_sd15.bin'),
            ('models/image_encoder/pytorch_model.bin', root/'image_encoder_for_ip_adapter'/'pytorch_model.bin'),
            ('models/image_encoder/config.json', root/'image_encoder_for_ip_adapter'/'config.json'),
          ]
          for src, dst in assets:
              dst.parent.mkdir(parents=True, exist_ok=True)
              cached = Path(hf_hub_download(repo_id='h94/IP-Adapter', filename=src))
              dst.write_bytes(cached.read_bytes())
              print(src, dst, dst.stat().st_size)
          PY
          sha256sum external/DiffStega/pretrained_models/ip-adapter-plus_sd15.bin \
                    external/DiffStega/pretrained_models/ip-adapter-plus-face_sd15.bin \
                    external/DiffStega/pretrained_models/image_encoder_for_ip_adapter/pytorch_model.bin \
                    external/DiffStega/pretrained_models/image_encoder_for_ip_adapter/config.json \
                    | tee evidence/ip_adapter_sha256.txt

      - name: Download official UniStega corpus
        run: |
          mkdir -p external/DiffStega/dataset
          python -m gdown 'https://drive.google.com/uc?id=1ITaNvYAP8hB32TxwEo4Rdf-515plUOdA' -O evidence/unistega_download
          file evidence/unistega_download | tee evidence/unistega_file_type.txt
          sha256sum evidence/unistega_download | tee evidence/unistega_archive_sha256.txt
          if unzip -t evidence/unistega_download >/dev/null 2>&1; then
            unzip -q evidence/unistega_download -d external/DiffStega/dataset
          else
            tar -xf evidence/unistega_download -C external/DiffStega/dataset
          fi
          find external/DiffStega/dataset -maxdepth 3 -type f | sort | head -n 80 | tee evidence/unistega_tree_head.txt
          if [ -d external/DiffStega/dataset/content_prompts ] && [ ! -e external/DiffStega/dataset/UniStega ]; then
            (cd external/DiffStega/dataset && ln -s . UniStega)
          elif [ -d external/DiffStega/dataset/Unistega ] && [ ! -e external/DiffStega/dataset/UniStega ]; then
            (cd external/DiffStega/dataset && ln -s Unistega UniStega)
          fi

      - name: Run NARCIS frozen preflight and retain manifest
        continue-on-error: true
        run: |
          python tools/diffstega_gpu_preflight.py \
            --diffstega-root external/DiffStega \
            --output evidence/preflight.json \
            > evidence/preflight.stdout.log 2> evidence/preflight.stderr.log

      - name: Evaluate preflight excluding hosted-runner CUDA gate
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          p = json.loads(Path('evidence/preflight.json').read_text())
          print(json.dumps(p, indent=2))
          checks = p['checks']
          required = ['commit_matches','tracked_source_unchanged','python_matches','packages_match','assets_present','unistega_counts_match']
          failed = [k for k in required if not checks.get(k)]
          print({'cuda_available': checks.get('cuda_available'), 'non_cuda_failures': failed})
          if failed:
              raise SystemExit('Non-CUDA DiffStega preflight checks failed: ' + ','.join(failed))
          PY

      - name: Upload frozen preflight evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: tomm-diffstega-frozen-preflight
          path: evidence
          if-no-files-found: error
          retention-days: 30
