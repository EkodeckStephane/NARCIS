name: TOMM revision validation

on:
  push:
    branches: [arcis-tomm-final-sync, arcis-tomm-d1-d7, arcis-a1-a10-repair]
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  unit-tests:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip

      - name: Install Python dependencies
        run: python -m pip install --upgrade pip && python -m pip install -r requirements.txt

      - name: Compile frozen TOMM execution tools
        run: |
          python -m py_compile \
            tools/diffstega_gpu_preflight.py \
            tools/evaluate_diffstega_outputs.py \
            tools/tomm_final_cnn_from_frozen_payload.py \
            tools/verify_a3_control_plane.py \
            tools/verify_a4_canonical_lineage.py
          python - <<'PY'
          import json
          from pathlib import Path
          notebook = json.loads(Path('notebooks/TOMM_DiffStega_Free_GPU.ipynb').read_text(encoding='utf-8'))
          assert notebook['nbformat'] == 4
          assert len(notebook['cells']) >= 5
          print({'notebook_cells': len(notebook['cells']), 'valid_json': True})
          PY
          bash -n tools/run_diffstega_frozen_gpu.sh
          bash -n tools/bootstrap_diffstega_free_gpu.sh
          bash -n tools/run_diffstega_metrics_frozen.sh

      - name: Run unit tests
        env:
          PYTHONPATH: src
        run: python -m pytest -q

      - name: Verify A3 authenticated control-plane audit
        env:
          PYTHONPATH: src
        run: |
          python tools/verify_a3_control_plane.py
          git diff --exit-code -- tomm_results/A3_AUTHENTICATED_CONTROL_PLANE_AUDIT.json

      - name: Verify A4 release-manifest consistency
        run: |
          python - <<'PY'
          import hashlib
          import json
          from pathlib import Path

          audit = json.loads(Path("tomm_results/A4_CANONICAL_LINEAGE_AUDIT.json").read_text(encoding="utf-8"))
          holdout_path = Path("tomm_results/caltech_external_holdout_aggregate.json")
          holdout = json.loads(holdout_path.read_text(encoding="utf-8"))
          campaign = Path("TOMM_FRESH_CAMPAIGN.md").read_text(encoding="utf-8")

          assert audit["status"] == "PASS"
          assert holdout["aggregate"]["trials"] == 1200
          assert holdout["aggregate"]["successes"] == 1163
          assert holdout["aggregate"]["maximum_rs_corrections"] == 64

          digest = hashlib.sha256(holdout_path.read_bytes()).hexdigest()
          assert digest == audit["canonical_holdout"]["sha256"]

          expected = audit["canonical_checkpoint_bundle"]["checkpoint_sha256"]
          for seed, sha in expected.items():
              assert sha in campaign, f"checkpoint SHA for seed {seed} missing from TOMM_FRESH_CAMPAIGN.md"

          per_seed = {str(row["seed"]): row for row in holdout["per_seed"]}
          for seed, expected_row in audit["canonical_holdout"]["per_seed"].items():
              row = per_seed[seed]
              assert row["trials"] == expected_row["trials"]
              assert row["successes"] == expected_row["successes"]
              assert row["maximum_rs_corrections"] == expected_row["maximum_rs_corrections"]

          print({"A4_static_consistency": "PASS", "holdout_sha256": digest})
          PY

      - name: TOMM preflight without datasets
        env:
          PYTHONPATH: src
        run: python run_tomm_validation.py --stage preflight --output tomm_results_ci

  acm-latex:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install TeX Live ACM dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            texlive-latex-extra \
            texlive-fonts-recommended \
            texlive-fonts-extra \
            texlive-bibtex-extra \
            texlive-publishers
          kpsewhich acmart.cls
          kpsewhich libertine.sty
          kpsewhich zi4.sty
          kpsewhich newtxmath.sty

      - name: Compile ACM TOMM scaffold
        working-directory: paper/ACM_TOMM
        run: |
          pdflatex -interaction=nonstopmode -halt-on-error ARCIS_TOMM.tex
          bibtex ARCIS_TOMM
          pdflatex -interaction=nonstopmode -halt-on-error ARCIS_TOMM.tex
          pdflatex -interaction=nonstopmode -halt-on-error ARCIS_TOMM.tex
