name: TOMM revision validation

on:
  push:
    branches: [tomm-revision]
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  unit-tests:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip

      - name: Install Python dependencies
        run: python -m pip install --upgrade pip && python -m pip install -r requirements.txt

      - name: Run unit tests
        env:
          PYTHONPATH: src
        run: python -m pytest -q

      - name: TOMM preflight without datasets
        env:
          PYTHONPATH: src
        run: python run_tomm_validation.py --stage preflight --output tomm_results_ci

  acm-latex:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install TeX Live ACM dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            texlive-latex-extra \
            texlive-fonts-recommended \
            texlive-fonts-extra \
            texlive-bibtex-extra \
            texlive-publishers
          kpsewhich acmart.cls
          kpsewhich libertine.sty
          kpsewhich zi4.sty
          kpsewhich newtxmath.sty

      - name: Compile ACM TOMM scaffold
        working-directory: paper/ACM_TOMM
        run: |
          pdflatex -interaction=nonstopmode -halt-on-error NARCIS_TOMM.tex
          bibtex NARCIS_TOMM
          pdflatex -interaction=nonstopmode -halt-on-error NARCIS_TOMM.tex
          pdflatex -interaction=nonstopmode -halt-on-error NARCIS_TOMM.tex
