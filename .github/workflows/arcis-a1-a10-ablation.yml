name: ARCIS A1-A10 component ablation
on:
  push:
    branches: [arcis-a1-a10-repair]
    paths:
      - 'tools/tomm_final_channel_recheck.py'
      - 'src/narcis/**'
      - 'tests/**'
      - '.github/workflows/arcis-a1-a10-ablation.yml'
  workflow_dispatch:
jobs:
  component-ablation:
    strategy:
      fail-fast: false
      max-parallel: 5
      matrix:
        seed: [11, 29, 47, 71, 101]
    runs-on: ubuntu-latest
    timeout-minutes: 360
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
      - name: Install frozen scientific environment
        run: |
          python -m pip install --upgrade pip
          python -m pip install --index-url https://download.pytorch.org/whl/cpu torch==2.10.0 torchvision==0.25.0
          python -m pip install 'cryptography>=45' 'numpy>=2.2' 'pandas>=2.2' 'Pillow>=11' 'psutil>=7' 'pytest>=8' 'reedsolo>=1.7' 'scikit-learn>=1.6' 'scipy>=1.15'
          python -m pip freeze | sort > requirements-tomm-freeze.txt
      - name: Unit tests
        env: {PYTHONPATH: src}
        run: python -m pytest -q
      - name: Prepare canonical fresh-lineage directories
        run: |
          mkdir -p "arcis_a1_a10/checkpoints_${{ matrix.seed }}" "arcis_a1_a10/seed_${{ matrix.seed }}"
      - name: Download official Caltech-101
        run: |
          mkdir -p data
          curl --fail --location --retry 6 --retry-all-errors 'https://data.caltech.edu/records/mzrjq-6wc02/files/caltech-101.zip?download=1' -o data/caltech.zip
          test "$(sha256sum data/caltech.zip | awk '{print $1}')" = '331234750fc7f77520e50d9565e8b6907b03565e30320da1401130db08c61f91'
          unzip -q data/caltech.zip -d data/x
          INNER="$(find data/x -type f -name 101_ObjectCategories.tar.gz | head -n 1)"
          mkdir -p data/images
          tar -xzf "$INNER" -C data/images
          echo "CALTECH_ROOT=$(find data/images -type d -name 101_ObjectCategories | head -n 1)" >> "$GITHUB_ENV"
      - name: Run authenticated channel and component ablation
        env: {PYTHONPATH: src}
        run: |
          python tools/tomm_final_channel_recheck.py \
            --dataset-root "$CALTECH_ROOT" \
            --checkpoint-root "arcis_a1_a10/checkpoints_${{ matrix.seed }}" \
            --output "arcis_a1_a10/seed_${{ matrix.seed }}" \
            --seed "${{ matrix.seed }}" \
            --epochs 5 \
            --component-ablation
          cp requirements-tomm-freeze.txt "arcis_a1_a10/seed_${{ matrix.seed }}/requirements-tomm-freeze.txt"
      - name: Verify canonical fresh-checkpoint lineage
        env: {PYTHONPATH: src}
        run: |
          python - <<'PY'
          import json, os
          from pathlib import Path
          seed = os.environ["SEED"]
          p = Path(f"arcis_a1_a10/seed_{seed}/channel_recheck_manifest.json")
          m = json.loads(p.read_text(encoding="utf-8"))
          print("expected:", m["checkpoint_expected_sha256"])
          print("actual:  ", m["checkpoint_actual_sha256"])
          if not m["checkpoint_matches_recorded_fresh_campaign"]:
              raise SystemExit("Fresh checkpoint SHA does not match the recorded canonical campaign")
          PY
        env:
          PYTHONPATH: src
          SEED: ${{ matrix.seed }}
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: arcis-a1-a10-seed-${{ matrix.seed }}
          path: |
            arcis_a1_a10/seed_${{ matrix.seed }}
          if-no-files-found: warn
          retention-days: 30