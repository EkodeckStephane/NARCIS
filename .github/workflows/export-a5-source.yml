name: Export ARCIS A5 source
on:
  push:
    branches: [arcis-a5-canonical-benchmark]
    paths:
      - '.github/workflows/export-a5-source.yml'
  workflow_dispatch:

jobs:
  export-source:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Stage exact A5 source
        run: |
          mkdir -p a5_source
          cp -R src a5_source/src
          cp -R tools a5_source/tools
          cp run_bossbase_campaign.py a5_source/
          cp requirements.txt a5_source/
          cp pytest.ini a5_source/
          git rev-parse HEAD > a5_source/SOURCE_COMMIT.txt
      - uses: actions/upload-artifact@v4
        with:
          name: arcis-a5-source
          path: a5_source
          if-no-files-found: error
          retention-days: 1
