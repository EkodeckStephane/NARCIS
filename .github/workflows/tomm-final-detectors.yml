name: TOMM final detector audit

on:
  workflow_dispatch:
  push:
    branches: [tomm-revision]
    paths:
      - 'tools/tomm_final_detector_audit.py'
      - 'tools/tomm_final_channel_recheck.py'
      - 'TOMM_CANONICAL_AUDIT_EXECUTION_FREEZE.md'
      - 'TOMM_ALIGNED_CHANNEL_RECHECK_FREEZE.md'
      - '.github/workflows/tomm-final-detectors.yml'

jobs:
  caltech-final-detectors:
    strategy:
      fail-fast: false
      matrix:
        seed: [11, 29, 47, 71, 101]
    runs-on: ubuntu-latest
    timeout-minutes: 360
    steps:
      - name: Checkout frozen revision
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip

      - name: Install CPU scientific environment
        run: |
          python -m pip install --upgrade pip
          python -m pip install --index-url https://download.pytorch.org/whl/cpu torch==2.10.0 torchvision==0.25.0
          python -m pip install \
            'cryptography>=45' 'numpy>=2.2' 'pandas>=2.2' 'Pillow>=11' \
            'psutil>=7' 'reedsolo>=1.7' 'scikit-learn>=1.6' 'scipy>=1.15'

      - name: Download official Caltech-101
        run: |
          mkdir -p dataset_external/caltech101
          curl --fail --location --retry 6 --retry-all-errors \
            'https://data.caltech.edu/records/mzrjq-6wc02/files/caltech-101.zip?download=1' \
            --output dataset_external/caltech101/caltech-101.zip
          md5sum dataset_external/caltech101/caltech-101.zip
          sha256sum dataset_external/caltech101/caltech-101.zip
          unzip -q dataset_external/caltech101/caltech-101.zip -d dataset_external/caltech101/extracted
          INNER_ARCHIVE="$(find dataset_external/caltech101/extracted -type f -name 101_ObjectCategories.tar.gz | head -n 1)"
          test -n "$INNER_ARCHIVE"
          mkdir -p dataset_external/caltech101/images
          tar -xzf "$INNER_ARCHIVE" -C dataset_external/caltech101/images
          CALTECH_ROOT="$(find dataset_external/caltech101/images -type d -name 101_ObjectCategories | head -n 1)"
          test -n "$CALTECH_ROOT"
          export CALTECH_ROOT
          echo "CALTECH_ROOT=$CALTECH_ROOT" >> "$GITHUB_ENV"
          python - <<'PY'
          from pathlib import Path
          import os
          from PIL import Image
          root = Path(os.environ['CALTECH_ROOT'])
          suffixes = {'.jpg', '.jpeg', '.png', '.bmp', '.pgm', '.ppm', '.tif', '.tiff'}
          paths = sorted(p for p in root.rglob('*') if p.is_file() and p.suffix.lower() in suffixes)
          readable = 0
          modes = {}
          for p in paths:
              with Image.open(p) as im:
                  im.load()
                  readable += 1
                  modes[im.mode] = modes.get(im.mode, 0) + 1
          print({'root': str(root), 'images': len(paths), 'readable': readable, 'modes': modes})
          if len(paths) != 9144 or readable != 9144:
              raise SystemExit('Caltech-101 provenance check failed')
          if modes != {'RGB': 8733, 'L': 411}:
              raise SystemExit(f'Caltech-101 mode census mismatch: {modes}')
          PY

      - name: Execute aligned frozen channel recheck
        env:
          PYTHONPATH: src
        run: |
          python tools/tomm_final_channel_recheck.py \
            --dataset-root "$CALTECH_ROOT" \
            --checkpoint-root "tomm_final_detector_work/checkpoints_seed_${{ matrix.seed }}" \
            --output "tomm_final_detector_work/seed_${{ matrix.seed }}" \
            --seed "${{ matrix.seed }}" \
            --epochs 5

      - name: Execute frozen multi-session detector audit
        env:
          PYTHONPATH: src
        run: |
          python tools/tomm_final_detector_audit.py \
            --dataset-root "$CALTECH_ROOT" \
            --checkpoint-root "tomm_final_detector_work/checkpoints_seed_${{ matrix.seed }}" \
            --output "tomm_final_detector_work/seed_${{ matrix.seed }}" \
            --seed "${{ matrix.seed }}" \
            --epochs 0 \
            --repeats 20

      - name: Verify channel and detector schedule identity
        run: |
          python - <<'PY'
          from pathlib import Path
          import hashlib
          import json
          root = Path('tomm_final_detector_work/seed_${{ matrix.seed }}')
          channel = json.loads((root / 'channel_recheck_manifest.json').read_text(encoding='utf-8'))
          detector = json.loads((root / 'audit_manifest.json').read_text(encoding='utf-8'))
          def sha(path):
              h = hashlib.sha256()
              with path.open('rb') as f:
                  for block in iter(lambda: f.read(1024 * 1024), b''):
                      h.update(block)
              return h.hexdigest()
          schedule = sha(root / 'schedule.csv')
          target = sha(root / 'session_target.npy')
          expected_schedule = channel['artifacts']['schedule_csv_sha256']
          expected_target = channel['artifacts']['session_target_npy_sha256']
          if schedule != expected_schedule:
              raise SystemExit(f'schedule hash changed: {schedule} != {expected_schedule}')
          if target != expected_target:
              raise SystemExit(f'target hash changed: {target} != {expected_target}')
          if detector['artifacts']['schedule_csv_sha256'] != schedule:
              raise SystemExit('detector manifest schedule hash mismatch')
          if detector['artifacts']['session_target_npy_sha256'] != target:
              raise SystemExit('detector manifest target hash mismatch')
          print({'schedule_sha256': schedule, 'session_target_sha256': target, 'identity': True})
          PY

      - name: Upload frozen evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: tomm-final-detectors-seed-${{ matrix.seed }}
          path: |
            tomm_final_detector_work/seed_${{ matrix.seed }}
            tomm_final_detector_work/checkpoints_seed_${{ matrix.seed }}/encoder_seed_${{ matrix.seed }}.pt
          if-no-files-found: warn
          retention-days: 30
