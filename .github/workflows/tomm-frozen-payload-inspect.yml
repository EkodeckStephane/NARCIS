name: Inspect frozen TOMM detector payload

on:
  push:
    branches: [tomm-revision]
    paths:
      - '.github/workflows/tomm-frozen-payload-inspect.yml'
  workflow_dispatch:

jobs:
  inspect-payload:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Decode frozen payload
        run: |
          set -euo pipefail
          cat tools/.tomm_frozen_payload/part*.b64 > /tmp/payload.b64
          base64 -d /tmp/payload.b64 > /tmp/payload.zlib
          python - <<'PY'
          import zlib
          from pathlib import Path
          raw = Path('/tmp/payload.zlib').read_bytes()
          data = zlib.decompress(raw)
          Path('/tmp/payload.py').write_bytes(data)
          print({'compressed_bytes': len(raw), 'decoded_bytes': len(data)})
          PY
          sha256sum /tmp/payload.py

      - name: Show frozen certification hooks
        run: |
          echo '--- IMPORTS / CONSTANTS ---'
          grep -n -E "NativeImageDataset|FROZEN|EXPECTED|target_raw|sha256|base64|zlib" /tmp/payload.py | head -n 120 || true
          echo '--- DATASET / TARGET / SCHEDULE ---'
          grep -n -E "discover_images|index_paths|dataset=|dataset =|identifiers|target=|target =|actual=|actual =|expected=|expected =|schedule.csv|run_detectors" /tmp/payload.py | head -n 160 || true
          echo '--- MAIN BODY ---'
          sed -n '39,67p' /tmp/payload.py
