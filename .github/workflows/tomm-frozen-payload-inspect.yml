name: Inspect frozen TOMM detector payload

on:
  push:
    branches: [tomm-revision]
    paths:
      - '.github/workflows/tomm-frozen-payload-inspect.yml'
  workflow_dispatch:

jobs:
  inspect-payload:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Decode frozen payload
        run: |
          set -euo pipefail
          cat tools/.tomm_frozen_payload/part*.b64 > /tmp/payload.b64
          base64 -d /tmp/payload.b64 > /tmp/payload.zlib
          python - <<'PY'
          import zlib
          from pathlib import Path
          raw = Path('/tmp/payload.zlib').read_bytes()
          data = zlib.decompress(raw)
          Path('/tmp/payload.py').write_bytes(data)
          print({'compressed_bytes': len(raw), 'decoded_bytes': len(data)})
          PY
          sha256sum /tmp/payload.py

      - name: Show frozen payload CLI and execution hooks
        run: |
          python /tmp/payload.py --help || true
          echo '--- ARGUMENTS ---'
          grep -n "add_argument" /tmp/payload.py || true
          echo '--- ENTRY POINT ---'
          grep -n -E "def main|__main__|run_detectors|cnn|schedule|payload" /tmp/payload.py | tail -n 120 || true
